# Dire Wolf lab configuration -- fictional station,
# off-air tests only. Chapter 5 of the guide walks
# through this file section by section.

# MYCALL is this station's call sign. N0CALL is not a
# real call sign: it is the placeholder Dire Wolf's own
# examples use for "not set yet". Replace it with your
# own call sign before a radio is connected -- and
# never transmit under the placeholder.
MYCALL N0CALL

# The audio device between computer and radio. On a
# real station this names the sound device wired to
# the radio. The lab machine has no sound card and no
# radio, so a run with this file stops at this line --
# after the configuration has been read and checked.
ADEVICE plughw:1,0
ACHANNELS 1

# One radio channel at 1200 baud -- ordinary VHF
# packet, AFSK tones at 1200 and 2200 Hz.
CHANNEL 0
MODEM 1200

# A fill-in digipeater rule, in the form the project
# documentation recommends for the WIDE paths other
# stations ask for (chapter 10).
DIGIPEAT 0 0 ^WIDE[3-7]-[1-7]$ ^WIDE[12]-[1]$

# The two doors other programs knock on (chapter 7).
AGWPORT 8000
KISSPORT 8001

# One position beacon, half an hour apart, announcing
# the fictional lab site (chapter 12). Times here are
# in minutes. The position is invented: open farmland,
# nobody's station, nobody's home.
PBEACON delay=1 every=30 overlay=S symbol="digi" lat=44.8330 long=-89.5003 comment="Bramble Hill lab site - fictional"
