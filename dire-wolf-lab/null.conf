# The lab variant of direwolf.conf -- identical except
# for the ADEVICE line. ALSA, the Linux sound system,
# has a built-in device called "null" that accepts
# audio and discards it, and produces silence as input.
# With it, Dire Wolf starts completely on a machine
# with no sound card and no radio: a modem playing to
# an empty room. Transcript t07 was captured with
# this file. Never use it on a real station -- a
# transmitter keyed into silence is still keyed.
MYCALL N0CALL

ADEVICE null
ACHANNELS 1

CHANNEL 0
MODEM 1200

DIGIPEAT 0 0 ^WIDE[3-7]-[1-7]$ ^WIDE[12]-[1]$

# The standard door numbers are 8000 (AGW) and 8001
# (KISS), as in direwolf.conf. The shared build machine
# already had another program listening on 8000 when
# the lab ran -- Dire Wolf's answer, quoted in chapter
# 16, was "Some other application is probably already
# using port 8000" -- so the lab run moved both doors
# up by 10000 rather than disturb it.
AGWPORT 18000
KISSPORT 18001

PBEACON delay=1 every=30 overlay=S symbol="digi" lat=44.8330 long=-89.5003 comment="Bramble Hill lab site - fictional"
